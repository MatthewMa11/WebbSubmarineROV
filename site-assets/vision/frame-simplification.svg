<svg xmlns="http://www.w3.org/2000/svg" width="720" height="555" viewBox="0 0 720 555" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">A simpler frame, in numbers</title><desc id="desc">Frame panels reduced from 8 to 5. Frame joint bolts reduced from 24 to 8. Shared bar scale begins at zero; these are CAD counts, not test results.</desc><rect x="0" y="0" width="720" height="555" rx="0" fill="#f2f0e6" stroke="none"/><text x="32" y="40" font-size="14" fill="#486068" font-weight="700">WEBB / VISION &amp; PURPOSE</text><text x="32" y="83" font-size="30" fill="#102c35" font-weight="700">A simpler frame, in numbers</text><text x="32" y="119" font-size="20" fill="#486068" font-weight="400">October 18 revision · counts from the CAD record</text><rect x="32" y="151" width="18" height="18" rx="14" fill="#81949a" stroke="none"/><text x="60" y="168" font-size="18" fill="#102c35" font-weight="400">Earlier frame</text><rect x="280" y="151" width="18" height="18" rx="14" fill="#177d79" stroke="none"/><text x="308" y="168" font-size="18" fill="#102c35" font-weight="400">Simplified frame</text><text x="32" y="220" font-size="24" fill="#102c35" font-weight="700">Frame panels</text><rect x="32" y="238" width="184" height="32" rx="3" fill="#81949a" stroke="none"/><text x="230" y="263" font-size="24" fill="#102c35" font-weight="700">8</text><rect x="32" y="284" width="115" height="32" rx="3" fill="#177d79" stroke="none"/><text x="161" y="309" font-size="24" fill="#102c35" font-weight="700">5</text><text x="32" y="375" font-size="24" fill="#102c35" font-weight="700">Frame joint bolts</text><rect x="32" y="393" width="552" height="32" rx="3" fill="#81949a" stroke="none"/><text x="598" y="418" font-size="24" fill="#102c35" font-weight="700">24</text><rect x="32" y="439" width="184" height="32" rx="3" fill="#177d79" stroke="none"/><text x="230" y="464" font-size="24" fill="#102c35" font-weight="700">8</text><text x="32" y="522" font-size="20" fill="#486068" font-weight="400">Fewer parts to assemble. Physical checks still needed.</text></svg>