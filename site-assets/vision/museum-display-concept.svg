<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">From workshop to museum</title><desc id="desc">Three proposed display stations: see CAD revisions, compare unpowered parts, and predict movement with a thruster diagram. This is a concept, not an approved exhibition.</desc><rect x="0" y="0" width="720" height="780" rx="0" fill="#f2f0e6" stroke="none"/><text x="32" y="40" font-size="14" fill="#486068" font-weight="700">WEBB / VISION &amp; PURPOSE</text><text x="32" y="83" font-size="30" fill="#102c35" font-weight="700">From workshop to museum</text><text x="32" y="120" font-size="20" fill="#486068" font-weight="400">Concept sketch · subject to museum staff input</text><rect x="32" y="155" width="656" height="166" rx="14" fill="#ffffff" stroke="none"/><rect x="50" y="175" width="58" height="44" rx="7" fill="#102c35" stroke="none"/><text x="63" y="206" font-size="24" fill="#fff" font-weight="700">01</text><text x="126" y="206" font-size="24" fill="#102c35" font-weight="700">SEE THE DESIGN</text><text x="54" y="254" font-size="22" fill="#102c35" font-weight="400">Show CAD views and a revision timeline.</text><text x="54" y="290" font-size="22" fill="#486068" font-weight="400">Ask: what changed, and why?</text><rect x="32" y="345" width="656" height="166" rx="14" fill="#ffffff" stroke="none"/><rect x="50" y="365" width="58" height="44" rx="7" fill="#102c35" stroke="none"/><text x="63" y="396" font-size="24" fill="#fff" font-weight="700">02</text><text x="126" y="396" font-size="24" fill="#102c35" font-weight="700">COMPARE THE PARTS</text><text x="54" y="444" font-size="22" fill="#102c35" font-weight="400">Display unpowered demonstration parts.</text><text x="54" y="480" font-size="22" fill="#486068" font-weight="400">Ask: which version is easier to repair?</text><rect x="32" y="535" width="656" height="166" rx="14" fill="#ffffff" stroke="none"/><rect x="50" y="555" width="58" height="44" rx="7" fill="#102c35" stroke="none"/><text x="63" y="586" font-size="24" fill="#fff" font-weight="700">03</text><text x="126" y="586" font-size="24" fill="#102c35" font-weight="700">TRY AN IDEA</text><text x="54" y="634" font-size="22" fill="#102c35" font-weight="400">Use a thruster-direction diagram.</text><text x="54" y="670" font-size="22" fill="#486068" font-weight="400">Ask: how would you move sideways?</text><text x="32" y="745" font-size="20" fill="#486068" font-weight="400">Start with a small display; build on visitor questions.</text></svg>