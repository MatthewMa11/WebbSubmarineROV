<svg xmlns="http://www.w3.org/2000/svg" width="940" height="574" viewBox="0 0 940 574" role="img" aria-labelledby="journal-diagram-3-title journal-diagram-3-description" font-family="Arial, Helvetica, sans-serif">
<title id="journal-diagram-3-title">Current saved thruster assembly</title>
