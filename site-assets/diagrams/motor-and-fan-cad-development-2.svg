<svg xmlns="http://www.w3.org/2000/svg" width="940" height="376" viewBox="0 0 940 376" role="img" aria-labelledby="journal-diagram-2-title journal-diagram-2-description" font-family="Arial, Helvetica, sans-serif">
<title id="journal-diagram-2-title">R6 torque and axial retention</title>
<desc id="journal-diagram-2-description">R6 torque and axial retention. Intended functions · not measured load capacity. Motor-face openings → Four solid fan keys; Four solid fan keys → Transmit torque to the fan; Two opposed M3x16 bolt stacks → External bell clamp; External bell clamp → Resist axial separation.</desc>
