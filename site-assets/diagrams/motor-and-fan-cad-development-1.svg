<svg xmlns="http://www.w3.org/2000/svg" width="620" height="794" viewBox="0 0 620 794" role="img" aria-labelledby="journal-diagram-1-title journal-diagram-1-description" font-family="Arial, Helvetica, sans-serif">
<title id="journal-diagram-1-title">R4 cover joint stack</title>
<desc id="journal-diagram-1-description">R4 cover joint stack. Schematic · not to scale · screw head to tip. M3x12 screw head → Front flat washer: 0.5 mm; Front flat washer: 0.5 mm → Cover tab: 5 mm; Cover tab: 5 mm → Nozzle seat: 3 mm; Nozzle seat: 3 mm → Rear flat washer: 0.5 mm; Rear flat washer: 0.5 mm → Captured M3 nut: 2.4 mm; Captured M3 nut: 2.4 mm → Nominal tip projection: 0.6 mm.</desc>
<defs><marker id="journal-diagram-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#178396"/></marker></defs>
<rect width="620" height="794" rx="18" fill="#f5f1e7"/>
<rect x="32" y="28" width="5" height="51" rx="2.5" fill="#178396"/>
<text x="50" y="48" fill="#153247" font-size="24" font-weight="700">R4 cover joint stack</text>
<text x="50" y="76" fill="#40586a" font-size="16">Schematic · not to scale · screw head to tip</text>
<path data-from="H" data-to="W1" d="M 310 174 V 201" fill="none" stroke="#178396" stroke-width="2.5" marker-end="url(#journal-diagram-1-arrow)"/>
