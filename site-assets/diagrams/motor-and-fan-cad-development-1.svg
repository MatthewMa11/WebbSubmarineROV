<path data-from="W2" data-to="Nut" d="M 310 542 V 569" fill="none" stroke="#178396" stroke-width="2.5" marker-end="url(#journal-diagram-1-arrow)"/>
<path data-from="Nut" data-to="Tip" d="M 310 634 V 661" fill="none" stroke="#178396" stroke-width="2.5" marker-end="url(#journal-diagram-1-arrow)"/>
